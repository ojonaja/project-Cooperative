<div class="container mt-5">
  <h2>บัญชีรวม</h2>
  <h3>ยอดเงินคงเหลือ: {{ totalBalance }} บาท</h3>
  <h3 class="mt-5">ประวัติการทำธุรกรรม</h3>
  <ul class="list-group">
    <li class="list-group-item" *ngFor="let transaction of transactionHistory">
      {{ transaction.date }}: {{ transaction.amount }} บาท ({{ transaction.transactionType }})
    </li>
  </ul>
</div>
