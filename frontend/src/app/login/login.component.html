<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<div class="login-container">
    <div class="card">
        <i class="fas fa-user-circle icon"></i> <!-- Icon -->
        <h2>Login</h2>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div>
                <label for="email">อีเมล</label>
                <input id="email" formControlName="email" type="email" placeholder="อีเมล" required />
            </div>

            <div>
                <label for="password">รหัสผ่าน</label>
                <input id="password" formControlName="password" type="password" placeholder="รหัสผ่าน" required />
            </div>

            <button type="submit">เข้าสู่ระบบ</button>

            <!-- Display error message if present -->
            <div *ngIf="errorMessage">{{ errorMessage }}</div>
        </form>

        <!-- Change buttons to text links -->
        <a routerLink="/register" class="link-button">สมัครสมาชิก</a>
        <a routerLink="/forgot-password" class="link-button">ลืมรหัสผ่าน?</a> <!-- Updated link -->

        <div *ngIf="showRegisterForm">
            <h3>สมัครสมาชิก</h3>
            <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
                <div>
                    <label for="registerEmail">อีเมล</label>
                    <input id="registerEmail" formControlName="email" type="email" placeholder="อีเมล" required />
                </div>

                <div>
                    <label for="registerPassword">รหัสผ่าน</label>
                    <input id="registerPassword" formControlName="password" type="password" placeholder="รหัสผ่าน"
                        required />
                </div>

                <button type="submit">สมัครสมาชิก</button>
                <div *ngIf="errorMessage">{{ errorMessage }}</div>
            </form>
        </div>

        <div *ngIf="showForgotPassword">
            <h3>ลืมรหัสผ่าน</h3>
            <p>กรุณาติดต่อฝ่ายสนับสนุนเพื่อรีเซ็ตรหัสผ่านของคุณ</p>
        </div>
    </div>
</div>
