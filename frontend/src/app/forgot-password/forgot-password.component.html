<div class="container mt-5">
    <h2>ลืมรหัสผ่าน</h2>
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" formControlName="email" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="idCard" class="form-label">ID Card</label>
        <input type="text" id="idCard" formControlName="idCard" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="newPassword" class="form-label">New Password</label>
        <input type="password" id="newPassword" formControlName="newPassword" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirm New Password</label>
        <input type="password" id="confirmPassword" formControlName="confirmPassword" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>
  
    <div *ngIf="successMessage" class="alert alert-success mt-3">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>
  </div>
