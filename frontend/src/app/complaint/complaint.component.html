<div class="container mt-5">
  <h2>เขียนคำร้องเรียน</h2>
  <div *ngIf="name && email">
    <p><strong>ชื่อ:</strong> {{ name }}</p>
    <p><strong>อีเมล:</strong> {{ email }}</p>
  </div>
  <form [formGroup]="complaintForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="complaint" class="form-label">คำร้องเรียน</label>
      <textarea id="complaint" formControlName="complaint" class="form-control" rows="5" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">ส่งคำร้องเรียน</button>
  </form>

  <div *ngIf="successMessage" class="alert alert-success mt-3">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>
</div>
