<div class="container mt-5">
  <h2>คำนวณดอกเบี้ย</h2>
  <form [formGroup]="interestForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="principal" class="form-label">จำนวนเงินต้น</label>
      <input type="number" id="principal" formControlName="principal" class="form-control" required />
    </div>
    <div class="mb-3">
      <label for="rate" class="form-label">อัตราดอกเบี้ย (%)</label>
      <input type="number" id="rate" formControlName="rate" class="form-control" required />
    </div>
    <div class="mb-3">
      <label for="time" class="form-label">ระยะเวลา (ปี)</label>
      <input type="number" id="time" formControlName="time" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">คำนวณดอกเบี้ย</button>
  </form>

  <div *ngIf="interestResult !== null" class="alert alert-success mt-3">
    ดอกเบี้ยที่คำนวณได้: {{ interestResult | number:'1.2-2' }} บาท
  </div>
  <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>
</div>
