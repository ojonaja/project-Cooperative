<div style="display: flex; flex-direction: column; align-items: center;">
  <h2>รายงานฝาก-ถอน</h2>

  <div style="display: flex; flex-direction: column; align-items: center;">
    <h2>เงินรวมทั้งหมด</h2>
    <div style="width: 400px;">
      <label for="totalMoney">จำนวนเงิน</label>
      <input id="totalMoney" type="number" [(ngModel)]="totalMoney" placeholder="จำนวนเงิน" required />
      <p>ดอกเบี้ยที่ได้ต่อปี: {{ annualInterest | currency }}</p>
    </div>
  </div>
</div>
